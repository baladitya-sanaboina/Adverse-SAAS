# Production stack: Caddy (HTTPS) in front of the four apps, the API, Postgres, Redis and a TURN
# relay for meets. Run from this folder:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Full steps: docs/Deployment.md. Nothing here publishes Postgres, Redis or the API to the internet.
name: adverse

x-web: &web
  restart: unless-stopped
  environment:
    BACKEND_INTERNAL_URL: http://backend:8000
  depends_on:
    backend:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      MANAGER_DOMAIN: ${MANAGER_DOMAIN}
      EMPLOYEE_DOMAIN: ${EMPLOYEE_DOMAIN}
      CLIENT_DOMAIN: ${CLIENT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin
      - manager
      - employee
      - client

  admin:
    <<: *web
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.web.prod
      args: { APP: Admin, PORT: "3000" }

  manager:
    <<: *web
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.web.prod
      args: { APP: Manager, PORT: "3001" }

  employee:
    <<: *web
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.web.prod
      args: { APP: Employee, PORT: "3002" }

  client:
    <<: *web
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.web.prod
      args: { APP: Client, PORT: "3003" }

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend.prod
    restart: unless-stopped
    env_file: ../backend/.env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://adverse:${POSTGRES_PASSWORD}@postgres:5432/adverse
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TURN_SECRET: ${TURN_SECRET}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - backend_storage:/app/storage
      - backend_private:/app/private-storage
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrations:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.prisma
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://adverse:${POSTGRES_PASSWORD}@postgres:5432/adverse
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: adverse
      POSTGRES_USER: adverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adverse -d adverse"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Relays meet audio/video for people on strict office or mobile networks. Uses the host network
  # because it needs a range of UDP ports; open 3478 (UDP+TCP) and 49160-49200/UDP on the firewall.
  # Credentials are short-lived HMACs made by the API from TURN_SECRET; no passwords are stored.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=${TURN_REALM}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Never relay into private networks (stops the relay being used to reach internal hosts).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --log-file=stdout

volumes:
  caddy_data:
  caddy_config:
  backend_storage:
  backend_private:
  postgres_data:
  redis_data:
