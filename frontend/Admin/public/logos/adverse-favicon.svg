<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.5 9.5 81 81" role="img" aria-label="Adverse">
  <!-- Adverse orbit mark: static version of Logos/adverse-orbit-animation-*.html (same geometry).
       The gaps where planets cross the rings are cut out with a mask, so the background stays transparent. -->
  <defs>
    <mask id="adverse-orbit-gaps" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <circle cx="50" cy="25" r="7.5" fill="#000"/>
      <circle cx="28.4" cy="62.5" r="7.5" fill="#000"/>
      <circle cx="79.1" cy="74.4" r="9" fill="#000"/>
    </mask>
  </defs>
  <g fill="none" stroke="#0876ED" stroke-width="3.5" mask="url(#adverse-orbit-gaps)">
    <circle cx="50" cy="50" r="38"/>
    <circle cx="50" cy="50" r="25"/>
  </g>
  <g fill="#0876ED">
    <circle cx="50" cy="50" r="11"/>
    <circle cx="50" cy="25" r="5.5"/>
    <circle cx="28.4" cy="62.5" r="5.5"/>
    <circle cx="79.1" cy="74.4" r="7"/>
  </g>
</svg>
