<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline · Adverse</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-family: Poppins, Arial, Helvetica, sans-serif;
        color: #151c29;
        background: #f8fbff;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #f5f5f7; background: #0a0a0b; }
        main { background: #121214; border-color: #232327; }
        p { color: #8e8e93; }
      }
      main {
        max-width: 380px;
        padding: 28px 24px;
        border: 1px solid #e4f2ff;
        border-radius: 16px;
        background: #fff;
        text-align: center;
      }
      img { width: 56px; height: 56px; }
      h1 { margin: 12px 0 6px; font-size: 1.1rem; }
      p { margin: 0 0 18px; color: #667085; font-size: 0.9rem; line-height: 1.5; }
      button {
        height: 40px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #0876ed;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logos/adverse-favicon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Adverse needs a connection. Check your Wi-Fi or mobile data, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
