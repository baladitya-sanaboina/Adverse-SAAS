<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adverse orbit animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --blue: #0876ed; --white: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--white);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 48px; padding: 24px;
    font-family: Poppins, Helvetica, Arial, sans-serif;
  }
  .stage { display: flex; align-items: center; gap: clamp(16px, 3vw, 36px); cursor: pointer; }
  .mark { width: clamp(160px, 38vw, 320px); height: auto; flex: none; overflow: visible; }
  .sun { transform-box: fill-box; transform-origin: center; animation: sun 0.9s cubic-bezier(.3,1.5,.5,1) 0.2s both; }
  .ring { fill: none; stroke: var(--blue); stroke-width: 3.5; stroke-dasharray: 1; }
  .r2 { animation: draw 0.9s ease-in-out 0.9s both; }
  .r1 { animation: draw 1s ease-in-out 1.1s both; }
  .orbit { transform-box: view-box; transform-origin: 50px 50px; }
  .o1 { animation: spin 10s linear 2.8s infinite; }
  .o2 { animation: spin 14s linear 2.8s infinite reverse; }
  .o3 { animation: spin 22s linear 2.8s infinite; }
  .dot { fill: var(--blue); stroke: var(--white); stroke-width: 4; paint-order: stroke; transform-box: fill-box; transform-origin: center; }
  .d1 { animation: pop 0.6s cubic-bezier(.3,1.6,.5,1) 1.9s both; }
  .d2 { animation: pop 0.6s cubic-bezier(.3,1.6,.5,1) 2.1s both; }
  .d3 { animation: pop 0.6s cubic-bezier(.3,1.6,.5,1) 2.3s both; }
  @keyframes sun { from { transform: scale(0); } }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  @keyframes pop { from { transform: scale(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 560px) {
    .stage { flex-direction: column; text-align: center; }
    }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage" role="img" aria-label="Adverse">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ring r2" cx="50" cy="50" r="38" pathLength="1" transform="rotate(-90 50 50)"/>
      <circle class="ring r1" cx="50" cy="50" r="25" pathLength="1" transform="rotate(-90 50 50)"/>
      <circle class="sun" cx="50" cy="50" r="11" fill="#0876ed"/>
      <g class="orbit o1"><circle class="dot d1" cx="50" cy="25" r="5.5"/></g>
      <g class="orbit o2"><circle class="dot d2" cx="28.4" cy="62.5" r="5.5"/></g>
      <g class="orbit o3"><circle class="dot d3" cx="79.1" cy="74.4" r="7"/></g>
    </svg>
  </div>
<script>
  var stage = document.getElementById('stage');
  function replay() {
    stage.style.display = 'none';
    void stage.offsetHeight;
    stage.style.display = '';
  }
  stage.addEventListener('click', replay);
</script>
</body>
</html>
